spring.application.name=fullstack-backend

# Server Configuration
server.port=8080

# CORS Configuration
# For GitHub Codespaces, set this in environment variable
# Default ports include Vite (5173) and legacy dev servers (3000).
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8090,http://localhost:80,https://*.githubpreview.dev,https://*.preview.app.github.dev,https://*.app.github.dev}

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.com.demo.fullstack=INFO
logging.level.org.springframework.web=INFO
